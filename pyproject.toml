[project]
name = "lalala"
version = "0.1.0"
description = "Lalala (SoundTrace) : un Shazam amélioré qui retrouve une chanson à partir d'un souvenir, d'une reprise ou d'un son bruité"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=4.45",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "google-genai>=1.0",
    "openai>=1.50",
    "httpx>=0.27",
    "tenacity>=9.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "pyacoustid>=1.3",
    "pytest>=8.0",
    "ijson>=3.6.0",
    "torchvision>=0.29.1",
    "pillow>=13.0.0",
    "sentence-transformers>=6.2.0",
    "timm>=1.0.30",
    "nnaudio>=0.3.4",
    "demucs>=4.0.1",
    "docopt>=0.6.2",
    "psutil>=7.2.2",
    "joblib>=1.6.0",
    "faster-whisper>=1.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: tests qui appellent le LLM (Ollama) ; ignorés si le serveur n'est pas joignable",
    "gemini: tests qui appellent l'API Gemini ; ignorés sans GEMINI_API_KEY",
]
addopts = "-ra"

[tool.uv]
package = false
